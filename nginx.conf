# Codevirus Security — Production Nginx Reverse Proxy Configuration
# Domain: voice.codevirussec.in

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=voice_limit:10m rate=5r/s;

server {
    listen 80;
    server_name voice.codevirussec.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voice.codevirussec.in;

    # SSL Certificates (Cloudflare / Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/voice.codevirussec.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.codevirussec.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prevent access to hidden files and server source
    location ~ /\.(env|git) {
        deny all;
        return 403;
    }

    # Proxy to Node.js backend
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Telephony Webhook Fast-Path
    location /webhook {
        limit_req zone=voice_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

